name: Windows verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Build and verify a temporary Windows ZIP
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run assets:prepare
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:plugin
      - run: npm run build
      - run: npm run verify:windows
      - if: github.event_name == 'workflow_dispatch' && inputs.candidate
        run: npm run dist:zip
      - if: github.event_name == 'workflow_dispatch' && inputs.candidate
        run: npm run verify:windows -- --candidate
